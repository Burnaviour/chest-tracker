<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Burnaviour Chest Tracker overlay</title>
  <style>
    @font-face { font-family: "Barlow Condensed"; src: url(assets/fonts/BarlowCondensed-Bold.ttf) format("truetype"); font-weight: 700; font-display: swap; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    html, body { background: transparent !important; overflow: hidden; padding: 4px; font-family: "Barlow Condensed", "Segoe UI", system-ui, sans-serif; }
    .pill { display: inline-flex; align-items: center; gap: 16px; max-width: 410px; min-height: 90px; padding: 10px 26px 10px 14px; background: #17162b; border: 2px solid #dac996; border-radius: 20px; box-shadow: inset 0 0 18px rgba(124, 58, 237, .35); user-select: none; }
    .pill img { width: 60px; height: 60px; object-fit: contain; filter: drop-shadow(0 3px 6px rgba(0, 0, 0, .6)); }
    .values { display: flex; flex-direction: column; gap: 2px; }
    .label { font: 600 12px/1 "Segoe UI", system-ui, sans-serif; color: #c9d1e0; white-space: nowrap; max-width: 210px; overflow: hidden; text-overflow: ellipsis; }
    .counts { display: flex; align-items: baseline; gap: 10px; direction: ltr; white-space: nowrap; }
    .counter { font-size: 56px; font-weight: 700; line-height: 1; color: #dac996; font-variant-numeric: tabular-nums; text-shadow: 0 0 18px rgba(218, 201, 150, .5), 0 2px 4px rgba(0, 0, 0, .9); }
    .detailed .counter { font-size: 46px; }
    .last { font-size: 26px; font-weight: 700; line-height: 1; color: #4ade80; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div class="pill">
    <img src="assets/chest.png" alt="">
    <div class="values">
      <span id="overlayCaption" class="label" hidden></span>
      <div class="counts"><div id="total" class="counter">—</div><span id="overlayLast" class="last" hidden></span></div>
    </div>
  </div>
  <script type="module" src="overlay.js"></script>
</body>
</html>
